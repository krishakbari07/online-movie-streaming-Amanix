{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>App Feedback - Amanix</title>
    <link rel="stylesheet" href="{% static 'css/navbar.css' %}">
    <style>
        :root {
            --primary: #e50914;
            --bg-dark: #0a0b10;
            --glass-bg: rgba(255, 255, 255, 0.03);
            --glass-border: rgba(255, 255, 255, 0.08);
            --text-main: #ffffff;
            --text-muted: #a3abbb;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--bg-dark);
            background-image: radial-gradient(circle at top right, rgba(229, 9, 20, 0.08), transparent 45%);
            color: var(--text-main);
            font-family: 'Inter', 'Poppins', sans-serif;
            min-height: 100vh;
        }

        .container {
            max-width: 700px;
            margin: 120px auto 60px;
            padding: 60px;
            background: var(--glass-bg);
            backdrop-filter: blur(30px);
            border: 1px solid var(--glass-border);
            border-radius: 32px;
            box-shadow: 0 40px 100px rgba(0, 0, 0, 0.6);
            animation: slideUp 0.8s ease-out;
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        h1 {
            font-size: 2.5rem;
            font-weight: 800;
            margin-bottom: 10px;
            letter-spacing: -1px;
            background: linear-gradient(90deg, #fff 0%, #a3abbb 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .form-group {
            margin-bottom: 30px;
        }

        label {
            display: block;
            margin-bottom: 10px;
            color: var(--text-muted);
            font-size: 0.9rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        input[type="email"],
        select,
        textarea {
            width: 100%;
            padding: 14px 20px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--glass-border);
            border-radius: 12px;
            color: #fff;
            font-family: inherit;
            font-size: 1rem;
            outline: none;
            transition: all 0.3s;
        }

        input:focus, select:focus, textarea:focus {
            background: rgba(255, 255, 255, 0.08);
            border-color: var(--primary);
            box-shadow: 0 0 15px rgba(229, 9, 20, 0.2);
        }

        textarea {
            min-height: 180px;
        }

        .star-rating {
            display: flex;
            flex-direction: row-reverse;
            justify-content: flex-end;
            gap: 15px;
            margin: 15px 0;
        }

        .star-rating input[type="radio"] { display: none; }
        .star-rating label {
            font-size: 2.5rem;
            color: #333;
            cursor: pointer;
            transition: all 0.2s;
        }

        .star-rating label:hover,
        .star-rating label:hover ~ label,
        .star-rating input[type="radio"]:checked ~ label,
        .star-rating input[type="radio"]:checked + label {
            color: #ffd166;
            text-shadow: 0 0 15px rgba(255, 209, 102, 0.4);
        }
        
        .star-rating label:hover {
            transform: scale(1.15);
        }

        .submit-btn {
            width: 100%;
            background: var(--primary);
            color: #fff;
            border: none;
            padding: 18px;
            border-radius: 14px;
            cursor: pointer;
            font-size: 1.1rem;
            font-weight: 800;
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            box-shadow: 0 10px 20px rgba(229, 9, 20, 0.3);
        }

        .submit-btn:hover {
            transform: translateY(-3px);
            background: #f40612;
            box-shadow: 0 15px 30px rgba(229, 9, 20, 0.4);
        }

        .optional {
            color: #555;
            font-size: 0.8rem;
            font-weight: 500;
            margin-left: 5px;
        }

        @media (max-width: 768px) {
            .container {
                margin: 100px 20px 40px;
                padding: 40px 25px;
            }
        }
    </style>
</head>
<body>
    {% include 'navbar.html' %}

    <div class="container">
        <h1>Share Your Feedback</h1>
        <p style="color: #b3b3b3; margin-bottom: 30px;">
            Help us improve! Share your thoughts about app usability, report bugs, or suggest UI/UX improvements.
        </p>

        <form id="feedbackForm" method="post" action="{% url 'submit_app_feedback' %}">
            {% csrf_token %}
            
            <div class="form-group">
                <label for="email">Email <span class="optional">(required)</span></label>
                <input type="email" id="email" name="email" value="{% if user_email %}{{ user_email }}{% endif %}" required>
            </div>

            <div class="form-group">
                <label for="category">Category</label>
                <select id="category" name="category" required>
                    <option value="usability">Usability</option>
                    <option value="bug">Bug Report</option>
                    <option value="uiux">UI / UX</option>
                    <option value="other">Other</option>
                </select>
            </div>

            <div class="form-group">
                <label>Overall Rating <span class="optional">(optional)</span></label>
                <div class="star-rating">
                    <input type="radio" id="star5" name="rating" value="5">
                    <label for="star5">★</label>
                    <input type="radio" id="star4" name="rating" value="4">
                    <label for="star4">★</label>
                    <input type="radio" id="star3" name="rating" value="3">
                    <label for="star3">★</label>
                    <input type="radio" id="star2" name="rating" value="2">
                    <label for="star2">★</label>
                    <input type="radio" id="star1" name="rating" value="1">
                    <label for="star1">★</label>
                </div>
            </div>

            <div class="form-group">
                <label for="message">Your Feedback <span class="optional">(required)</span></label>
                <textarea id="message" name="message" placeholder="Describe your feedback, bug report, or suggestion..." required></textarea>
            </div>

            <button type="submit" class="submit-btn">Submit Feedback</button>
        </form>
    </div>

    <script>
        function showToast(message, isError = false, callback = null) {
            let container = document.getElementById('toast-container');
            if (!container) {
                container = document.createElement('div');
                container.id = 'toast-container';
                Object.assign(container.style, {
                    position: 'fixed', top: '25px', right: '25px', zIndex: '99999',
                    display: 'flex', flexDirection: 'column', gap: '12px'
                });
                document.body.appendChild(container);
            }
            
            const toast = document.createElement('div');
            Object.assign(toast.style, {
                background: isError ? 'rgba(229, 9, 20, 0.95)' : 'rgba(40, 167, 69, 0.95)',
                color: '#fff', padding: '16px 24px', borderRadius: '12px',
                boxShadow: '0 15px 35px rgba(0,0,0,0.5)', fontWeight: '600',
                fontSize: '1rem', backdropFilter: 'blur(10px)',
                border: '1px solid rgba(255,255,255,0.15)', transform: 'translateX(120%)',
                transition: 'transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275)',
                display: 'flex', alignItems: 'center', gap: '10px'
            });
            
            toast.innerHTML = `<i class="fa-solid ${isError ? 'fa-circle-xmark' : 'fa-circle-check'}" style="font-size: 1.2rem;"></i> <span>${message}</span>`;
            container.appendChild(toast);
            
            setTimeout(() => toast.style.transform = 'translateX(0)', 10);
            setTimeout(() => {
                toast.style.transform = 'translateX(120%)';
                setTimeout(() => {
                    toast.remove();
                    if (callback) callback();
                }, 400);
            }, 3000); // show for 3 seconds
        }

        document.getElementById('feedbackForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const formData = new FormData(this);
            
            fetch(this.action, {
                method: 'POST',
                body: formData,
                headers: {
                    'X-CSRFToken': formData.get('csrfmiddlewaretoken')
                }
            })
            .then(response => response.json())
            .then(data => {
                if (data.success) {
                    showToast('Thank you for your feedback!', false, () => this.reset());
                } else {
                    showToast(data.error || 'Feedback error', true);
                }
            })
            .catch(error => {
                showToast('An error occurred. Please try again.', true);
            });
        });
    </script>
</body>
</html>
